<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowdfunding DApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #f97316;
      margin-bottom: 2rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    .card h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.9rem;
    }

    .wallet-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .address-badge {
      flex: 1;
      font-size: 0.8rem;
      color: #64748b;
      font-family: monospace;
      word-break: break-all;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      color: #e2e8f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: #f97316; }
    input::placeholder { color: #475569; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: 0.85; }

    .btn-primary   { background: #f97316; color: #fff; }
    .btn-secondary { background: #3b82f6; color: #fff; }
    .btn-danger    { background: #ef4444; color: #fff; }
    .btn-ghost     { background: #1e2235; color: #94a3b8; border: 1px solid #2d3148; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    .info-item label {
      display: block;
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .info-item span {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .progress-wrap { margin-top: 0.9rem; }
    .progress-wrap label {
      display: block;
      font-size: 0.72rem;
      color: #64748b;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #2d3148;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s ease;
    }
    #progressLabel {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.3rem;
      text-align: right;
    }

    #ownerBadge {
      display: none;
      margin-top: 0.7rem;
      font-size: 0.78rem;
      color: #f97316;
      background: rgba(249,115,22,0.1);
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      width: fit-content;
    }

    .action-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .action-group > label { font-size: 0.8rem; color: #94a3b8; }

    .contribute-row { display: flex; gap: 0.5rem; }
    .contribute-row input { flex: 1; }

    .action-buttons {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.9rem;
    }

    #messageArea {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .msg {
      font-size: 0.8rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-family: monospace;
      word-break: break-all;
    }
    .msg.info    { background: #1e2235; color: #94a3b8; }
    .msg.success { background: rgba(34,197,94,0.1); color: #22c55e; }
    .msg.error   { background: rgba(239,68,68,0.1); color: #f87171; }

    #messageArea::-webkit-scrollbar { width: 4px; }
    #messageArea::-webkit-scrollbar-track { background: transparent; }
    #messageArea::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 2px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Crowdfunding DApp</h1>

  <!-- Wallet -->
  <div class="card">
    <h2>Wallet</h2>
    <div class="wallet-row">
      <button id="connectButton" class="btn-primary">Connecter MetaMask</button>
      <span id="connectedAddress" class="address-badge">Non connecté</span>
    </div>
    <div style="margin-top:0.6rem; font-size:0.78rem; color:#64748b; display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
      Réseau : <span id="networkName" style="color:#f97316; font-weight:600;">—</span>
      &nbsp;(Chain ID : <span id="chainId" style="color:#94a3b8;">—</span>)
      <button id="switchSepoliaButton" class="btn-ghost" style="font-size:0.75rem; padding:0.3rem 0.7rem;">
        Passer sur Sepolia
      </button>
    </div>
  </div>

  <!-- Adresse du contrat -->
  <div class="card">
    <h2>Contrat</h2>
    <div class="input-row">
      <input
        type="text"
        id="contractAddress"
        placeholder="0x… adresse du contrat déployé"
      />
      <button id="loadContractButton" class="btn-secondary">Charger</button>
    </div>
  </div>

  <!-- Informations campagne -->
  <div class="card">
    <h2>Informations de la campagne</h2>
    <div class="info-grid">
      <div class="info-item">
        <label>Objectif</label>
        <span id="goal">—</span>
      </div>
      <div class="info-item">
        <label>Total collecté</label>
        <span id="totalRaised">—</span>
      </div>
      <div class="info-item">
        <label>Deadline</label>
        <span id="deadline">—</span>
      </div>
      <div class="info-item">
        <label>Statut</label>
        <span id="status">—</span>
      </div>
      <div class="info-item">
        <label>Ma contribution</label>
        <span id="userContribution">—</span>
      </div>
      <div class="info-item">
        <label>Solde contrat</label>
        <span id="contractBalance">—</span>
      </div>
    </div>

    <div class="progress-wrap">
      <label>Progression</label>
      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
      <div id="progressLabel">0%</div>
    </div>

    <div id="ownerBadge">Vous êtes le propriétaire de cette campagne</div>

    <div style="margin-top: 0.9rem;">
      <button id="refreshButton" class="btn-ghost">Rafraîchir</button>
    </div>
  </div>

  <!-- Actions -->
  <div class="card">
    <h2>Actions</h2>
    <div class="action-group">
      <label>Contribuer (montant en ETH)</label>
      <div class="contribute-row">
        <input
          type="number"
          id="contributeAmount"
          placeholder="0.01"
          min="0"
          step="0.001"
        />
        <button id="contributeButton" class="btn-primary">Contribuer</button>
      </div>
    </div>
    <div class="action-buttons">
      <button id="withdrawButton" class="btn-secondary">Withdraw (owner)</button>
      <button id="refundButton" class="btn-danger">Refund</button>
    </div>
  </div>

  <!-- Logs -->
  <div class="card" id="logsCard" style="display:none;">
    <h2>Logs</h2>
    <div id="messageArea"></div>
  </div>
</div>

<!-- ethers.js v5 -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
